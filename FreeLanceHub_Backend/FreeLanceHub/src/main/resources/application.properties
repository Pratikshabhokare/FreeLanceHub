spring.application.name=freelancehub

server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freeLanceHub}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# OAuth2 Configuration - YOU MUST REPLACE THESE WITH YOUR KEYS
# See OAUTH_SETUP.md in the project root for instructions

# GOOGLE
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:PASTE_GOOGLE_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:PASTE_GOOGLE_CLIENT_SECRET_HERE}
spring.security.oauth2.client.registration.google.scope=profile,email

# GITHUB
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:PASTE_GITHUB_CLIENT_ID_HERE}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:PASTE_GITHUB_CLIENT_SECRET_HERE}
spring.security.oauth2.client.registration.github.scope=user:email,read:user
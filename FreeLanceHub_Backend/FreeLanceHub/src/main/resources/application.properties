spring.application.name=freelancehub

server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/freeLanceHub
spring.datasource.username=root
spring.datasource.password=root


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# OAuth2 Configuration - YOU MUST REPLACE THESE WITH YOUR KEYS
# See OAUTH_SETUP.md in the project root for instructions

# GOOGLE
spring.security.oauth2.client.registration.google.client-id=PASTE_GOOGLE_CLIENT_ID_HERE
spring.security.oauth2.client.registration.google.client-secret=PASTE_GOOGLE_CLIENT_SECRET_HERE
spring.security.oauth2.client.registration.google.scope=profile,email

# GITHUB
spring.security.oauth2.client.registration.github.client-id=PASTE_GITHUB_CLIENT_ID_HERE
spring.security.oauth2.client.registration.github.client-secret=PASTE_GITHUB_CLIENT_SECRET_HERE
spring.security.oauth2.client.registration.github.scope=user:email,read:user